# 2단계: 인증서 발급 후 최종 설정 (80 리다이렉트 + 443 종료)
#
# 설치 위치: /etc/nginx/sites-available/axisflow.team
#
# certbot 이 만드는 options-ssl-nginx.conf / ssl-dhparams.pem 에 의존하지 않도록
# SSL 파라미터를 이 파일 안에 직접 기술했다 (webroot 발급만으로도 동작해야 하므로).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 클라이언트가 보낸 안전한 요청 ID는 유지하고, 없거나 형식이 틀리면 nginx가 새로 발급한다.
map $http_x_request_id $axis_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
}

# 액세스 로그도 필드 검색이 가능한 한 줄 JSON으로 남긴다. 쿼리 문자열은 토큰 노출을 막기 위해 기록하지 않는다.
log_format axisflow_json escape=json
    '{"ts":"$time_iso8601","service":"nginx","event":"http.access",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"request_id":"$axis_request_id","host":"$host",'
    '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent","referer":"$http_referer"}';

# collab(WSS)은 외부에 열리는 유일한 비-API 경로다. 티켓 인증과 별개로 폭주를 막는다(§13.4).
#
# 연결 수는 두 겹으로 본다.
#  - collab_conn: IP 하나당. 문서 소켓은 **VSCode 창 하나당 1개**라, 공용 IP(학교·회사 NAT) 뒤에서
#    여러 명이 쓰면 4로는 두세 명에서 잘린다. 그래서 넉넉히 둔다.
#  - collab_total: IP와 무관한 전체 상한. IP당 값을 올려도 폭주는 이쪽이 막는다.
#    ($server_name 은 설정 파일의 서버 이름이라 사실상 상수 키다 — Host 헤더가 아니다.)
limit_conn_zone $binary_remote_addr zone=collab_conn:10m;
limit_conn_zone $server_name        zone=collab_total:1m;
limit_req_zone  $binary_remote_addr zone=collab_req:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=password_reset_req:10m rate=6r/m;

# ---------- 80 : ACME 챌린지 + HTTPS 리다이렉트 ----------
server {
    listen      80;
    listen      [::]:80;
    server_name axisflow.team;
    access_log  /var/log/nginx/access.log axisflow_json;
    add_header  X-Request-ID $axis_request_id always;

    # 갱신 시 HTTP-01 챌린지가 계속 통과해야 하므로 리다이렉트보다 먼저 매칭시킨다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 : TLS 종료 + 백엔드 프록시 ----------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name axisflow.team;
    access_log  /var/log/nginx/access.log axisflow_json;

    ssl_certificate     /etc/letsencrypt/live/axisflow.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axisflow.team/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    ssl_trusted_certificate   /etc/letsencrypt/live/axisflow.team/chain.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Nginx 가 직접 만든 413/429/502/503 응답에도 같은 요청 ID를 남긴다.
    # 업스트림이 붙인 헤더는 숨겨 같은 값이 두 줄로 합쳐지지 않게 한다.
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $axis_request_id always;

    # 업로드 최대 크기는 Drogon config.json 의 client_max_body_size 와 맞춘다.
    client_max_body_size 100M;

    # ---------- 협업 문서 서버 (collab = Node.js + Yjs) ----------
    # 문서 소켓(wss)을 collab 컨테이너로 넘긴다. WS 업그레이드 설정은 아래 /api/*/ws 와 같은 형태다.
    location ^~ /collab/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $axis_request_id;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # WebSocket 프레임이 아니라 핸드셰이크 HTTP 요청 한 번만 남는다. 쿼리는 JSON 로그에서 제외한다.
        access_log /var/log/nginx/access.log axisflow_json;

        # 티켓 인증과 별개로 필요한 방어(§9.2 공격면). 초과하면 nginx 가 503 을 돌려준다.
        limit_conn collab_conn 40;    # IP당 — 공용 IP 뒤 여러 사용자를 흡수한다
        limit_conn collab_total 200;  # 전체 — 한 IP가 몰아서 열어도 여기서 막힌다
        limit_req  zone=collab_req burst=40 nodelay;
    }

    # 슬래시 없는 /collab 은 뒤의 location / 로 흘러 backend 에 닿으므로 여기서 정리한다.
    location = /collab {
        return 301 /collab/;
    }

    # ---------- 공개 비밀번호 재설정 페이지 ----------
    # 메일 링크의 토큰은 URL fragment(#token=...)에만 있어 Nginx 로그로 전달되지 않는다.
    location = /reset-password {
        return 308 /reset-password/;
    }

    location ^~ /reset-password/ {
        root /var/www/axis-web;
        index index.html;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $axis_request_id always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # ---------- 내부 전용 API (/internal/*) ----------
    # backend <-> collab 사이의 통신이다. 밖으로는 절대 통과시키지 않는다(INTERNAL_TOKEN 이중 보호).
    location ^~ /internal/ {
        return 404;
    }

    # ---------- 실시간 WebSocket (/api/notification/ws, /api/github/ws) ----------
    # WS 업그레이드는 프록시가 Upgrade/Connection 을 그대로 넘겨야 성립한다.
    # 정확 매칭(=) 대신 앵커드 정규식으로 두 경로를 함께 처리한다.
    location ~ ^/api/(notification|github)/ws$ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $axis_request_id;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 프레임이 아니라 업그레이드 요청 한 번만 남는다. 요청 ID로 백엔드 로그와 연결한다.
        access_log /var/log/nginx/access.log axisflow_json;
    }

    # ---------- 비밀번호 재설정 API ----------
    # 계정 단위 쿨다운은 DB 가, IP 단위 폭주는 Nginx 가 막는다.
    location ~ ^/api/users/password-reset/(request|confirm)$ {
        limit_req zone=password_reset_req burst=4 nodelay;
        limit_req_status 429;
        error_page 429 = @password_reset_rate_limited;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $axis_request_id;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location @password_reset_rate_limited {
        default_type application/json;
        return 429 '{"status":"error","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요."}';
    }

    # ---------- 나머지 API ----------
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $axis_request_id;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
