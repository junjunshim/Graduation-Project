# 1단계: 인증서 발급 전 임시 설정 (HTTP 80 전용)
#
# - certbot webroot 발급을 위해 /.well-known/acme-challenge/ 경로만 열어둔다.
# - 발급이 끝나면 axisflow.team.conf 로 교체한다.
#
# 설치 위치: /etc/nginx/sites-available/axisflow.team

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_request_id $axis_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
}

log_format axisflow_json escape=json
    '{"ts":"$time_iso8601","service":"nginx","event":"http.access",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"request_id":"$axis_request_id","host":"$host",'
    '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent","referer":"$http_referer"}';

server {
    listen      80;
    listen      [::]:80;
    server_name axisflow.team;
    access_log  /var/log/nginx/access.log axisflow_json;
    # 업스트림 값 대신 Nginx가 최종 요청 ID 하나만 응답 헤더로 내려준다.
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $axis_request_id always;

    # Let's Encrypt HTTP-01 챌린지 전용 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 업로드 최대 크기는 Drogon config.json 의 client_max_body_size 와 맞춘다.
    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $axis_request_id;

        # WebSocket 업그레이드 통과용
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
