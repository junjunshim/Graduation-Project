<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Axis 비밀번호 재설정</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="brand" aria-label="Axis">Axis</div>

        <div id="invalid-view" class="state-panel" hidden>
          <span class="state-icon" aria-hidden="true">!</span>
          <h1 id="invalid-title">재설정 링크를 확인할 수 없습니다.</h1>
          <p>링크가 만료되었거나 이미 사용되었을 수 있습니다. 앱의 로그인 화면에서 비밀번호 재설정을 다시 요청해 주세요.</p>
        </div>

        <div id="form-view" hidden>
          <header class="card-header">
            <h1 id="form-title">새 비밀번호 설정</h1>
            <p>앞으로 사용할 새 비밀번호를 입력해 주세요.</p>
          </header>

          <form id="reset-form" novalidate>
            <label for="new-password">새 비밀번호</label>
            <div class="password-field">
              <input
                id="new-password"
                type="password"
                autocomplete="new-password"
                maxlength="64"
                placeholder="새 비밀번호를 입력하세요"
                required
              />
              <button id="toggle-password" type="button" class="text-button" aria-label="비밀번호 보기" aria-pressed="false">
                보기
              </button>
            </div>

            <label for="confirm-password">새 비밀번호 확인</label>
            <div class="password-field">
              <input
                id="confirm-password"
                type="password"
                autocomplete="new-password"
                maxlength="64"
                placeholder="새 비밀번호를 한 번 더 입력하세요"
                required
              />
            </div>

            <p class="guidance">8~64자이며 영문, 숫자, 특수문자를 모두 포함해야 합니다.</p>
            <div id="feedback" class="feedback" role="alert" hidden></div>

            <button id="submit-button" type="submit" class="primary-button">비밀번호 변경</button>
          </form>
        </div>

        <div id="success-view" class="state-panel" hidden>
          <span class="state-icon success" aria-hidden="true">✓</span>
          <h1 id="success-title">비밀번호가 변경되었습니다.</h1>
          <p>앱으로 돌아가 새 비밀번호로 로그인해 주세요. 보안을 위해 기존 로그인 세션은 모두 종료되었습니다.</p>
        </div>

        <footer>© 2026 Axis. All rights reserved.</footer>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
