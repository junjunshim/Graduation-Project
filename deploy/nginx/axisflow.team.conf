# 2단계: 인증서 발급 후 최종 설정 (80 리다이렉트 + 443 종료)
#
# 설치 위치: /etc/nginx/sites-available/axisflow.team
#
# certbot 이 만드는 options-ssl-nginx.conf / ssl-dhparams.pem 에 의존하지 않도록
# SSL 파라미터를 이 파일 안에 직접 기술했다 (webroot 발급만으로도 동작해야 하므로).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 80 : ACME 챌린지 + HTTPS 리다이렉트 ----------
server {
    listen      80;
    listen      [::]:80;
    server_name axisflow.team;

    # 갱신 시 HTTP-01 챌린지가 계속 통과해야 하므로 리다이렉트보다 먼저 매칭시킨다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 : TLS 종료 + 백엔드 프록시 ----------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name axisflow.team;

    ssl_certificate     /etc/letsencrypt/live/axisflow.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axisflow.team/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    ssl_trusted_certificate   /etc/letsencrypt/live/axisflow.team/chain.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 업로드 최대 크기는 Drogon config.json 의 client_max_body_size 와 맞춘다.
    client_max_body_size 100M;

    # ---------- 실시간 알림 WebSocket (/api/notification/ws) ----------
    location = /api/notification/ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 연결이 오래 유지되어 로그만 쌓이므로 WS 요청은 액세스 로그에 남기지 않는다.
        access_log off;
    }

    # ---------- 나머지 API ----------
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}