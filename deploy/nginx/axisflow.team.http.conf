# 1단계: 인증서 발급 전 임시 설정 (HTTP 80 전용)
#
# - certbot webroot 발급을 위해 /.well-known/acme-challenge/ 경로만 열어둔다.
# - 발급이 끝나면 axisflow.team.conf 로 교체한다.
#
# 설치 위치: /etc/nginx/sites-available/axisflow.team

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name axisflow.team;

    # Let's Encrypt HTTP-01 챌린지 전용 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 업로드 최대 크기는 Drogon config.json 의 client_max_body_size 와 맞춘다.
    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 업그레이드 통과용
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}