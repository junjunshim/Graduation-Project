services:
  # 1. 데이터베이스 서비스 (PostgreSQL)
  db:
    image: postgres:15
    container_name: ${DB_CONTAINER}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # ports:
    #  - "${DB_PORT}:5432"  # 로컬 PC의 포트와 컨테이너의 5432 연결
    volumes:
      # ./data 폴더에 있는 schema.sql을 컨테이너 시작 시 자동 실행
      - ./data:/docker-entrypoint-initdb.d
      # DB 데이터를 로컬에 저장 (컨테이너가 꺼져도 데이터 유지)
      - postgres_data:/var/lib/postgresql/data

  # 2. 백엔드 API 서비스 (C++ Drogon)
  backend:
    build:
      context: .                # 빌드할 파일들이 있는 위치 (루트)
      dockerfile: Dockerfile.backend  # 사용할 레시피 파일 이름
    container_name: ${SERVER_CONTAINER}
    ports:
      - "127.0.0.1:${SERVER_PORT}:8080"   # 호스트 루프백에만 바인딩 (외부 노출은 nginx 담당)
    depends_on:
      - db                      # 중요: DB가 먼저 켜진 후에 서버 실행
    environment:
      # C++ 코드 내에서 사용할 환경변수 (DB 접속 정보 등)
      SERVER_PORT: ${SERVER_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # 추가적으로 필요한 환경변수들을 여기에 정의
      API_KEY: ${API_KEY}
      # GitHub 자격증명(PAT) 암호화 키 - 서버 전용, 절대 커밋/로그 금지
      GITHUB_TOKEN_KEY: ${GITHUB_TOKEN_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      # collab 사이드카와의 내부 인증 토큰 (backend <-> collab). .env 에만 두고 커밋하지 않는다.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    volumes:
      - .:/app                  # 로컬 소스 수정을 컨테이너에 즉시 반영 (개발용)
      # 저장소 clone/worktree 전용 마운트.
      # 서버는 `cd /app/grad_server/build && ./grad_server` 로 뜬다(uploads 와 같은 CWD).
      # 따라서 CWD 기준 ./repository = /app/grad_server/build/repository 이고, 볼륨도 여기에 붙여야 한다.
      # (.:/app 안에 그냥 두면 clone/worktree 가 호스트 소스트리에 섞여 들어간다)
      - repository_data:/app/grad_server/build/repository

  # 3. 협업 문서 서버 (Node.js + Yjs, TASK_11 §9 / §13.2)
  #    텍스트의 진실(Y.Doc)과 worktree 파일 flush 를 담당한다. git 은 backend(C++) 만 한다.
  collab:
    build:
      context: .                # 빌드 컨텍스트는 루트다(Dockerfile 이 grad_collab/ 아래에 있다)
      dockerfile: grad_collab/Dockerfile.collab
    container_name: ${COLLAB_CONTAINER:-grad_collab}
    restart: always
    depends_on:
      - backend                 # 티켓 소비·세션 확정을 backend 내부 API 에 물어본다
    ports:
      - "127.0.0.1:${COLLAB_PORT:-3000}:3000"   # 호스트 루프백에만 바인딩 (외부 노출은 nginx /collab/ 담당)
    environment:
      PORT: 3000
      # compose 내부 네트워크에서는 서비스 이름이 호스트명이다.
      API_BASE: http://backend:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # 저장소 볼륨 마운트 지점. backend 와 같은 물리 볼륨을 다른 경로로 본다(§13.3.1).
      REPO_ROOT: /app/repository
    healthcheck:
      # 이미지에 curl 이 없으므로 node 의 fetch 로 확인한다.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # 저장소는 DB 와 같은 수명을 갖는다(§13.3.1) — down -v 면 둘 다 사라진다.
      - repository_data:/app/repository

volumes:
  postgres_data:                # DB 데이터 보존용 볼륨 정의
  repository_data:              # 서버 로컬 저장소(clone + 브랜치 worktree) 보존용 볼륨